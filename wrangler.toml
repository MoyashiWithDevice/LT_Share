name = "lt-share"
main = "worker.js"
compatibility_date = "2026-09-06"

# 静的アセット (public/static/*.css を /static/* として配信)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

# Cloudflare D1 (メタデータ)
[[d1_databases]]
binding = "DB"
database_name = "lt-db"
database_id = "9d59a932-4235-44be-acc8-6b23c947a5a6"

# Cloudflare R2 (PDF実体)
[[r2_buckets]]
binding = "SLIDES"
bucket_name = "lt-pdf"

[vars]
R2_PUBLIC_BASE_URL = "https://pub-9c6fb78fc32546389737119813bc107a.r2.dev"

# ADMIN_PASSWORD はシークレットとして登録:
#   npx wrangler secret put ADMIN_PASSWORD
# ローカル開発は .dev.vars に記述 (本番には上げないこと)
